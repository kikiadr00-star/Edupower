<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="KREASI CBT - Platform ujian daring interaktif untuk evaluasi siswa SD Kelas 4 dengan analisis butir soal otomatis.">
  <title>KREASI CBT Kelas 4 SD - Platform Evaluasi dan Analisis Siswa</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    const { useState, useEffect, useCallback } = React;
  </script>
  <link rel="stylesheet" href="css/main.css">
  <link rel="stylesheet" href="css/print.css">
</head>
<body>
  <div id="root"></div>
  <script src="js/data/initialData.js"></script>
  <script src="js/utils/storage.js"></script>
  <script src="js/components/Header.js"></script>
  <script src="js/components/Notification.js"></script>
  <script src="js/components/LandingPage.js"></script>
  <script src="js/components/StudentSetup.js"></script>
  <script src="js/components/ExamScreen.js"></script>
  <script src="js/components/ResultCard.js"></script>
  <script src="js/components/TeacherLogin.js"></script>
  <script src="js/components/TeacherDashboard.js"></script>
  <script type="text/babel">

function App() {
  // Navigation & General States
  const [view, setView] = useState('landing');
  const [questions, setQuestions] = useState(() => loadFromStorage(STORAGE_KEYS.QUESTIONS, INITIAL_QUESTIONS));
  const [examResults, setExamResults] = useState(() => loadFromStorage(STORAGE_KEYS.RESULTS, []));
  
  // Settings State
  const [settings, setSettings] = useState(() => loadFromStorage(STORAGE_KEYS.SETTINGS, DEFAULT_SETTINGS));

  // --- AUTO-SAVE TO LOCALSTORAGE ---
  useEffect(() => { saveToStorage(STORAGE_KEYS.QUESTIONS, questions); }, [questions]);
  useEffect(() => { saveToStorage(STORAGE_KEYS.RESULTS, examResults); }, [examResults]);
  useEffect(() => { saveToStorage(STORAGE_KEYS.SETTINGS, settings); }, [settings]);

  // Active Student State
  const [studentInfo, setStudentInfo] = useState({ name: '', class: '', rollNo: '' });
  const [examState, setExamState] = useState({
    currentQuestionIdx: 0,
    studentAnswers: {}, // questionId: selectedOptionIndex
    timeRemaining: 1800, // in seconds
    isSubmited: false,
    activeQuestionsOrder: [] // IDs of questions in their current randomized order
  });

  // Teacher Panel State
  const [teacherTab, setTeacherTab] = useState('dashboard'); // 'dashboard', 'questions', 'results', 'settings'
  const [editingQuestion, setEditingQuestion] = useState(null);
  const [isAddingQuestion, setIsAddingQuestion] = useState(false);
  const [isImporting, setIsImporting] = useState(false); // New state for import section
  const [importMode, setImportMode] = useState('append'); // 'append' or 'replace'
  const [pasteData, setPasteData] = useState('');
  const [showNotification, setShowNotification] = useState(null);

  // Helper trigger notification
  const triggerNotif = (message, type = 'success') => {
    setShowNotification({ message, type });
    setTimeout(() => setShowNotification(null), 4000);
  };

  // Timer Effect for Active Exam
  useEffect(() => {
    let timer;
    if (view === 'student_exam' && examState.timeRemaining > 0) {
      timer = setInterval(() => {
        setExamState(prev => {
          if (prev.timeRemaining <= 1) {
            clearInterval(timer);
            // Handle automatic submit
            handleAutoSubmit(prev.studentAnswers, prev.activeQuestionsOrder, prev.violations || 0);
            return { ...prev, timeRemaining: 0 };
          }
          return { ...prev, timeRemaining: prev.timeRemaining - 1 };
        });
      }, 1000);
    }
    return () => clearInterval(timer);
  }, [view]);

  // Total Max Points helper
  const getTotalMaxPoints = () => {
    return questions.reduce((sum, q) => sum + Number(q.points), 0);
  };

  // Initialize Exam Session
  const startExam = () => {
    if (questions.length === 0) {
      triggerNotif("Belum ada soal ujian tersedia! Guru harus menambahkan soal terlebih dahulu.", "error");
      return;
    }
    if (!studentInfo.name.trim() || !studentInfo.class.trim()) {
      triggerNotif("Harap isi Nama dan Kelas terlebih dahulu!", "error");
      return;
    }

    // Prepare questions (with optional randomization)
    let finalOrder = questions.map(q => q.id);
    if (settings.randomizeQuestions) {
      // Fisher-Yates shuffle
      for (let i = finalOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [finalOrder[i], finalOrder[j]] = [finalOrder[j], finalOrder[i]];
      }
    }

    setExamState({
      currentQuestionIdx: 0,
      studentAnswers: {},
      timeRemaining: settings.durationMinutes * 60,
      isSubmited: false,
      activeQuestionsOrder: finalOrder,
      violations: 0
    });

    setView('student_exam');
  };

  const handleSelectAnswer = (questionId, optionIndex) => {
    setExamState(prev => ({
      ...prev,
      studentAnswers: {
        ...prev.studentAnswers,
        [questionId]: optionIndex
      }
    }));
  };

  const calculateResultsSummary = (answers, order) => {
    let earnedPoints = 0;
    const totalPoints = getTotalMaxPoints();

    questions.forEach(q => {
      const studentAns = answers[q.id];
      if (studentAns !== undefined && studentAns === q.correctIndex) {
        earnedPoints += Number(q.points);
      }
    });

    const score = totalPoints > 0 ? Number(((earnedPoints / totalPoints) * 100).toFixed(2)) : 0;

    return { earnedPoints, totalPoints, score };
  };

  const handleAutoSubmit = (answers, order, violations = 0) => {
    const { earnedPoints, totalPoints, score } = calculateResultsSummary(answers, order);
    const newResult = {
      id: "res-" + Date.now(),
      studentName: studentInfo.name,
      studentClass: studentInfo.class,
      studentNo: studentInfo.rollNo || "-",
      submittedAt: new Date().toLocaleString('id-ID', { hour12: false }),
      answers: answers,
      score,
      earnedPoints,
      totalPoints,
      violations
    };

    setExamResults(prev => [newResult, ...prev]);
    setView('student_result');
  };

  const handleSubmitExam = () => {
    if (confirm("Apakah kamu yakin ingin mengumpulkan ujian sekarang?")) {
      handleAutoSubmit(examState.studentAnswers, examState.activeQuestionsOrder, examState.violations || 0);
    }
  };

  // Question CRUD Handlers
  const handleSaveQuestion = (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const text = formData.get('text');
    const subject = formData.get('subject');
    const points = Number(formData.get('points'));
    const difficulty = formData.get('difficulty');
    const topic = formData.get('topic');
    const correctIndex = Number(formData.get('correctIndex'));
    
    const options = [
      formData.get('opt0'),
      formData.get('opt1'),
      formData.get('opt2'),
      formData.get('opt3')
    ].filter(Boolean);

    if (options.length < 2) {
      triggerNotif("Minimal masukkan 2 pilihan jawaban!", "error");
      return;
    }

    if (editingQuestion) {
      // Update
      setQuestions(prev => prev.map(q => q.id === editingQuestion.id ? {
        ...q,
        subject, text, points, difficulty, topic, correctIndex, options
      } : q));
      triggerNotif("Soal berhasil diperbarui!");
      setEditingQuestion(null);
    } else {
      // Create new
      const newQ = {
        id: Date.now(),
        subject,
        text,
        points,
        difficulty,
        topic,
        correctIndex,
        options
      };
      setQuestions(prev => [...prev, newQ]);
      triggerNotif("Soal baru berhasil ditambahkan!");
      setIsAddingQuestion(false);
    }
  };

  const handleDeleteQuestion = (id) => {
    if (confirm("Apakah Anda yakin ingin menghapus soal ini?")) {
      setQuestions(prev => prev.filter(q => q.id !== id));
      triggerNotif("Soal berhasil dihapus!", "warning");
    }
  };

  // --- BULK IMPORT LOGIC ---
  const processImportedData = (rawText) => {
    try {
      const parsed = JSON.parse(rawText);
      if (!Array.isArray(parsed)) {
        throw new Error("Format data JSON harus berupa Array (menggunakan kurung siku [ ... ])");
      }

      const formattedQuestions = parsed.map((item, index) => {
        if (!item.text) throw new Error(`Soal urutan ke-${index + 1} tidak memiliki kunci 'text' (pertanyaan).`);
        if (!item.options || !Array.isArray(item.options) || item.options.length < 2) {
          throw new Error(`Soal urutan ke-${index + 1} harus memiliki minimal 2 pilihan jawaban di dalam 'options'.`);
        }
        if (item.correctIndex === undefined || item.correctIndex < 0 || item.correctIndex >= item.options.length) {
          throw new Error(`Soal urutan ke-${index + 1} memiliki 'correctIndex' yang tidak valid.`);
        }

        return {
          id: Date.now() + index,
          subject: item.subject || "Umum",
          topic: item.topic || "Latihan",
          text: item.text,
          options: item.options,
          correctIndex: Number(item.correctIndex),
          points: Number(item.points) || 10,
          difficulty: item.difficulty || "Sedang"
        };
      });

      if (importMode === 'replace') {
        setQuestions(formattedQuestions);
        triggerNotif(`Berhasil mengganti seluruh soal dengan ${formattedQuestions.length} soal baru!`);
      } else {
        setQuestions(prev => [...prev, ...formattedQuestions]);
        triggerNotif(`Berhasil mengimpor & menggabungkan ${formattedQuestions.length} soal baru!`);
      }

      // Reset states
      setIsImporting(false);
      setPasteData('');
    } catch (err) {
      triggerNotif("Gagal Impor: " + err.message, "error");
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      processImportedData(event.target.result);
    };
    reader.onerror = () => {
      triggerNotif("Gagal membaca file!", "error");
    };
    reader.readAsText(file);
  };

  const handlePasteSubmit = (e) => {
    e.preventDefault();
    if (!pasteData.trim()) {
      triggerNotif("Kolom teks tempel masih kosong!", "error");
      return;
    }
    processImportedData(pasteData);
  };

  const downloadJSONTemplate = () => {
    const template = [
      {
        subject: "Bahasa Indonesia",
        topic: "Ide Pokok",
        text: "Ide pokok paragraf adalah...",
        options: ["Gagasan utama paragraf", "Kalimat penjelas", "Judul bacaan", "Kesimpulan sementara"],
        correctIndex: 0,
        points: 10,
        difficulty: "Mudah"
      },
      {
        subject: "Matematika",
        topic: "Penjumlahan",
        text: "Hasil dari 125 + 375 adalah...",
        options: ["400", "450", "500", "550"],
        correctIndex: 2,
        points: 5,
        difficulty: "Mudah"
      }
    ];

    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(template, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "template_soal_cbt_sd4.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    triggerNotif("Template soal berhasil diunduh!");
  };

  // Statistics Calculation
  const getStatistics = () => {
    if (examResults.length === 0) return { avgScore: 0, maxScore: 0, minScore: 0, passingRate: 0, itemAnalysis: [] };
    const scores = examResults.map(r => r.score);
    const avgScore = scores.reduce((sum, s) => sum + s, 0) / scores.length;
    const maxScore = Math.max(...scores);
    const minScore = Math.min(...scores);
    const passedStudents = examResults.filter(r => r.score >= settings.passingScore).length;
    const passingRate = (passedStudents / examResults.length) * 100;

    // Hitung rata-rata kebenaran per soal
    const itemAnalysis = questions.map(q => {
      let correctCount = 0;
      let totalAttempts = 0;

      examResults.forEach(res => {
        if (res.answers[q.id] !== undefined) {
          totalAttempts++;
          if (res.answers[q.id] === q.correctIndex) {
            correctCount++;
          }
        }
      });

      return {
        questionId: q.id,
        topic: q.topic,
        subject: q.subject,
        difficulty: q.difficulty,
        points: q.points,
        correctRate: totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 0,
        correctCount,
        totalAttempts
      };
    });

    return {
      avgScore: avgScore.toFixed(1),
      maxScore,
      minScore,
      passingRate: passingRate.toFixed(1),
      itemAnalysis
    };
  };

  const stats = getStatistics();

  // Reset exam so another student can take it
  const resetToLanding = () => {
    setStudentInfo({ name: '', class: '', rollNo: '' });
    setView('landing');
  };

  const formatTime = (seconds) => {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  };

  return (
    <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col antialiased">
      {/* HEADER BAR */}
      <Header view={view} setView={setView} resetToLanding={resetToLanding} />

      {/* FLOATING NOTIFICATION */}
      <Notification showNotification={showNotification} />

      {/* MAIN LAYOUT CONTAINER */}
      <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

        {/* ======================================= */}
        {/* 1. LANDING PAGE                         */}
        {/* ======================================= */}
        {view === 'landing' && (
          <LandingPage setView={setView} />
        )}

        {/* ======================================= */}
        {/* 2. STUDENT EXAM SETUP (IDENTITAS)       */}
        {/* ======================================= */}
        {view === 'student_setup' && (
          <StudentSetup 
            studentInfo={studentInfo}
            setStudentInfo={setStudentInfo}
            questions={questions}
            settings={settings}
            getTotalMaxPoints={getTotalMaxPoints}
            setView={setView}
            startExam={startExam}
          />
        )}

        {/* ======================================= */}
        {/* 3. STUDENT EXAM SCREEN (PUNCAK UJIAN)   */}
        {/* ======================================= */}
        {view === 'student_exam' && (
          <ExamScreen 
            examState={examState}
            setExamState={setExamState}
            questions={questions}
            studentInfo={studentInfo}
            settings={settings}
            formatTime={formatTime}
            handleSelectAnswer={handleSelectAnswer}
            triggerNotif={triggerNotif}
            handleSubmitExam={handleSubmitExam}
          />
        )}

        {/* ======================================= */}
        {/* 4. STUDENT RESULT CARD (SKOR INSTAN)    */}
        {/* ======================================= */}
        {view === 'student_result' && (
          <ResultCard
            examResults={examResults}
            studentInfo={studentInfo}
            questions={questions}
            settings={settings}
            resetToLanding={resetToLanding}
            triggerNotif={triggerNotif}
          />
        )}

        {/* ======================================= */}
        {/* 4.5 TEACHER LOGIN                        */}
        {/* ======================================= */}
        {view === 'teacher_login' && (
          <TeacherLogin
            setView={setView}
            settings={settings}
            triggerNotif={triggerNotif}
          />
        )}

        {/* ======================================= */}
        {/* 5. TEACHER DASHBOARD (ANALISIS & EDIT)  */}
        {/* ======================================= */}
        {view === 'teacher_dashboard' && (
          <TeacherDashboard
            teacherTab={teacherTab}
            setTeacherTab={setTeacherTab}
            stats={stats}
            settings={settings}
            setSettings={setSettings}
            questions={questions}
            setQuestions={setQuestions}
            examResults={examResults}
            setExamResults={setExamResults}
            getTotalMaxPoints={getTotalMaxPoints}
            isImporting={isImporting}
            setIsImporting={setIsImporting}
            isAddingQuestion={isAddingQuestion}
            setIsAddingQuestion={setIsAddingQuestion}
            editingQuestion={editingQuestion}
            setEditingQuestion={setEditingQuestion}
            importMode={importMode}
            setImportMode={setImportMode}
            pasteData={pasteData}
            setPasteData={setPasteData}
            handleFileUpload={handleFileUpload}
            handlePasteSubmit={handlePasteSubmit}
            downloadJSONTemplate={downloadJSONTemplate}
            handleSaveQuestion={handleSaveQuestion}
            handleDeleteQuestion={handleDeleteQuestion}
            triggerNotif={triggerNotif}
          />
        )}

      </main>


      {/* FOOTER */}
      <Footer />
    </div>
  );
}

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  </script>
</body>
</html>
