// --- MOCK DATA FOR TEACHER ANALYSIS ---
const INITIAL_MOCK_RESULTS = [
  {
    id: "res-1",
    studentName: "Aditya Pratama",
    studentClass: "4-A",
    studentNo: "01",
    submittedAt: "25 Mei 2026, 08:30",

    score: 100,

  {

    studentName: "Siti Rahmawati",
    studentClass: "4-A",
    studentNo: "18",
    submittedAt: "25 Mei 2026, 08:42",
    answers: { 1: 0, 2: 2, 3: 1, 4: 1, 5: 2, 6: 1, 7: 2, 8: 3 }, // 1, 4, 8 incorrect
    score: 56.25,
    earnedPoints: 45,
    totalPoints: 80
  },
  {
    id: "res-3",
    studentName: "Budi Santoso",
    studentClass: "4-B",
    studentNo: "05",
    submittedAt: "25 Mei 2026, 08:50",
    answers: { 1: 1, 2: 1, 3: 1, 4: 0, 5: 0, 6: 1, 7: 2, 8: 1 }, // 2, 5 incorrect
    score: 68.75,

function App() {
  // Navigation & General States
  const [view, setView] = useState('landing'); // 'landing', 'student_setup', 'student_exam', 'student_result', 'teacher_dashboard'
  const [questions, setQuestions] = useState(INITIAL_QUESTIONS);
  const [examResults, setExamResults] = useState(INITIAL_MOCK_RESULTS);
  
  // Settings State
  const [settings, setSettings] = useState({
    randomizeQuestions: true,
    durationMinutes: 30,
    passingScore: 70
  });

  // Active Student State
  const [studentInfo, setStudentInfo] = useState({ name: '', class: '', rollNo: '' });
  const [examState, setExamState] = useState({
    currentQuestionIdx: 0,
    studentAnswers: {}, // questionId: selectedOptionIndex
    timeRemaining: 1800, // in seconds
    isSubmited: false,
    activeQuestionsOrder: [] // IDs of questions in their current randomized order
  });

  // Teacher Panel State
  const [teacherTab, setTeacherTab] = useState('dashboard'); // 'dashboard', 'questions', 'results', 'settings'
  const [editingQuestion, setEditingQuestion] = useState(null);
  const [isAddingQuestion, setIsAddingQuestion] = useState(false);
  const [isImporting, setIsImporting] = useState(false); // New state for import section
  const [importMode, setImportMode] = useState('append'); // 'append' or 'replace'
  const [pasteData, setPasteData] = useState('');
  const [showNotification, setShowNotification] = useState(null);

  // Helper trigger notification
  const triggerNotif = (message, type = 'success') => {
    setShowNotification({ message, type });
    setTimeout(() => setShowNotification(null), 4000);
  };

  // Timer Effect for Active Exam
  useEffect(() => {
    let timer;
    if (view === 'student_exam' && examState.timeRemaining > 0) {
      timer = setInterval(() => {
        setExamState(prev => {
          if (prev.timeRemaining <= 1) {
            clearInterval(timer);
            // Handle automatic submit
            handleAutoSubmit(prev.studentAnswers, prev.activeQuestionsOrder);
            return { ...prev, timeRemaining: 0 };
          }
          return { ...prev, timeRemaining: prev.timeRemaining - 1 };
        });
      }, 1000);
    }
    return () => clearInterval(timer);
  }, [view]);

  // Total Max Points helper
  const getTotalMaxPoints = () => {
    return questions.reduce((sum, q) => sum + Number(q.points), 0);
  };

  // Initialize Exam Session
  const startExam = () => {
    if (questions.length === 0) {
      triggerNotif("Belum ada soal ujian tersedia! Guru harus menambahkan soal terlebih dahulu.", "error");
      return;
    }
    if (!studentInfo.name.trim() || !studentInfo.class.trim()) {
      triggerNotif("Harap isi Nama dan Kelas terlebih dahulu!", "error");
      return;
    }

    // Prepare questions (with optional randomization)
    let finalOrder = questions.map(q => q.id);
    if (settings.randomizeQuestions) {
      // Fisher-Yates shuffle
      for (let i = finalOrder.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [finalOrder[i], finalOrder[j]] = [finalOrder[j], finalOrder[i]];
      }
    }

    setExamState({
      currentQuestionIdx: 0,
      studentAnswers: {},
      timeRemaining: settings.durationMinutes * 60,
      isSubmited: false,
      activeQuestionsOrder: finalOrder
    });

    setView('student_exam');
  };

  const handleSelectAnswer = (questionId, optionIndex) => {
    setExamState(prev => ({
      ...prev,
      studentAnswers: {
        ...prev.studentAnswers,
        [questionId]: optionIndex
      }
    }));
  };

  const calculateResultsSummary = (answers, order) => {
    let earnedPoints = 0;
    const totalPoints = getTotalMaxPoints();

    questions.forEach(q => {
      const studentAns = answers[q.id];
      if (studentAns !== undefined && studentAns === q.correctIndex) {
        earnedPoints += Number(q.points);
      }
    });

    const score = totalPoints > 0 ? Number(((earnedPoints / totalPoints) * 100).toFixed(2)) : 0;

    return { earnedPoints, totalPoints, score };
  };

  const handleAutoSubmit = (answers, order) => {
    const { earnedPoints, totalPoints, score } = calculateResultsSummary(answers, order);
    const newResult = {
      id: "res-" + Date.now(),
      studentName: studentInfo.name,
      studentClass: studentInfo.class,
      studentNo: studentInfo.rollNo || "-",
      submittedAt: new Date().toLocaleString('id-ID', { hour12: false }),
      answers: answers,
      score,
      earnedPoints,
      totalPoints
    };

    setExamResults(prev => [newResult, ...prev]);
    setView('student_result');
  };

  const handleSubmitExam = () => {
    if (confirm("Apakah kamu yakin ingin mengumpulkan ujian sekarang?")) {
      handleAutoSubmit(examState.studentAnswers, examState.activeQuestionsOrder);
    }
  };

  // Question CRUD Handlers
  const handleSaveQuestion = (e) => {
    e.preventDefault();
    const formData = new FormData(e.target);
    const text = formData.get('text');
    const subject = formData.get('subject');
    const points = Number(formData.get('points'));
    const difficulty = formData.get('difficulty');
    const topic = formData.get('topic');
    const correctIndex = Number(formData.get('correctIndex'));
    
    const options = [
      formData.get('opt0'),
      formData.get('opt1'),
      formData.get('opt2'),
      formData.get('opt3')
    ].filter(Boolean);

    if (options.length < 2) {
      triggerNotif("Minimal masukkan 2 pilihan jawaban!", "error");
      return;
    }

    if (editingQuestion) {
      // Update
      setQuestions(prev => prev.map(q => q.id === editingQuestion.id ? {
        ...q,
        subject, text, points, difficulty, topic, correctIndex, options
      } : q));
      triggerNotif("Soal berhasil diperbarui!");
      setEditingQuestion(null);
    } else {
      // Create new
      const newQ = {
        id: Date.now(),
        subject,
        text,
        points,
        difficulty,
        topic,
        correctIndex,
        options
      };
      setQuestions(prev => [...prev, newQ]);
      triggerNotif("Soal baru berhasil ditambahkan!");
      setIsAddingQuestion(false);
    }
  };

  const handleDeleteQuestion = (id) => {
    if (confirm("Apakah Anda yakin ingin menghapus soal ini?")) {
      setQuestions(prev => prev.filter(q => q.id !== id));
      triggerNotif("Soal berhasil dihapus!", "warning");
    }
  };

  // --- BULK IMPORT LOGIC ---
  const processImportedData = (rawText) => {
    try {
      const parsed = JSON.parse(rawText);
      if (!Array.isArray(parsed)) {
        throw new Error("Format data JSON harus berupa Array (menggunakan kurung siku [ ... ])");
      }

      const formattedQuestions = parsed.map((item, index) => {
        if (!item.text) throw new Error(`Soal urutan ke-${index + 1} tidak memiliki kunci 'text' (pertanyaan).`);
        if (!item.options || !Array.isArray(item.options) || item.options.length < 2) {
          throw new Error(`Soal urutan ke-${index + 1} harus memiliki minimal 2 pilihan jawaban di dalam 'options'.`);
        }
        if (item.correctIndex === undefined || item.correctIndex < 0 || item.correctIndex >= item.options.length) {
          throw new Error(`Soal urutan ke-${index + 1} memiliki 'correctIndex' yang tidak valid.`);
        }

        return {
          id: Date.now() + index,
          subject: item.subject || "Umum",
          topic: item.topic || "Latihan",
          text: item.text,
          options: item.options,
          correctIndex: Number(item.correctIndex),
          points: Number(item.points) || 10,
          difficulty: item.difficulty || "Sedang"
        };
      });

      if (importMode === 'replace') {
        setQuestions(formattedQuestions);
        triggerNotif(`Berhasil mengganti seluruh soal dengan ${formattedQuestions.length} soal baru!`);
      } else {
        setQuestions(prev => [...prev, ...formattedQuestions]);
        triggerNotif(`Berhasil mengimpor & menggabungkan ${formattedQuestions.length} soal baru!`);
      }

      // Reset states
      setIsImporting(false);
      setPasteData('');
    } catch (err) {
      triggerNotif("Gagal Impor: " + err.message, "error");
    }
  };

  const handleFileUpload = (e) => {
    const file = e.target.files[0];
    if (!file) return;

    const reader = new FileReader();
    reader.onload = (event) => {
      processImportedData(event.target.result);
    };
    reader.onerror = () => {
      triggerNotif("Gagal membaca file!", "error");
    };
    reader.readAsText(file);
  };

  const handlePasteSubmit = (e) => {
    e.preventDefault();
    if (!pasteData.trim()) {
      triggerNotif("Kolom teks tempel masih kosong!", "error");
      return;
    }
    processImportedData(pasteData);
  };

  const downloadJSONTemplate = () => {
    const template = [
      {
        subject: "Bahasa Indonesia",
        topic: "Ide Pokok",
        text: "Ide pokok paragraf adalah...",
        options: ["Gagasan utama paragraf", "Kalimat penjelas", "Judul bacaan", "Kesimpulan sementara"],
        correctIndex: 0,
        points: 10,
        difficulty: "Mudah"
      },
      {
        subject: "Matematika",
        topic: "Penjumlahan",
        text: "Hasil dari 125 + 375 adalah...",
        options: ["400", "450", "500", "550"],
        correctIndex: 2,
        points: 5,
        difficulty: "Mudah"
      }
    ];

    const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(template, null, 2));
    const downloadAnchor = document.createElement('a');
    downloadAnchor.setAttribute("href", dataStr);
    downloadAnchor.setAttribute("download", "template_soal_cbt_sd4.json");
    document.body.appendChild(downloadAnchor);
    downloadAnchor.click();
    downloadAnchor.remove();
    triggerNotif("Template soal berhasil diunduh!");
  };

  // Statistics Calculation
  const getStatistics = () => {
    if (examResults.length === 0) return { avgScore: 0, maxScore: 0, minScore: 0, passingRate: 0, itemAnalysis: [] };
    const scores = examResults.map(r => r.score);
    const avgScore = scores.reduce((sum, s) => sum + s, 0) / scores.length;
    const maxScore = Math.max(...scores);
    const minScore = Math.min(...scores);
    const passedStudents = examResults.filter(r => r.score >= settings.passingScore).length;
    const passingRate = (passedStudents / examResults.length) * 100;

    // Hitung rata-rata kebenaran per soal
    const itemAnalysis = questions.map(q => {
      let correctCount = 0;
      let totalAttempts = 0;

      examResults.forEach(res => {
        if (res.answers[q.id] !== undefined) {
          totalAttempts++;
          if (res.answers[q.id] === q.correctIndex) {
            correctCount++;
          }
        }
      });

      return {
        questionId: q.id,
        topic: q.topic,
        subject: q.subject,
        difficulty: q.difficulty,
        points: q.points,
        correctRate: totalAttempts > 0 ? Math.round((correctCount / totalAttempts) * 100) : 0,
        correctCount,
        totalAttempts
      };
    });

    return {
      avgScore: avgScore.toFixed(1),
      maxScore,
      minScore,
      passingRate: passingRate.toFixed(1),
      itemAnalysis
    };
  };

  const stats = getStatistics();

  // Reset exam so another student can take it
  const resetToLanding = () => {
    setStudentInfo({ name: '', class: '', rollNo: '' });
    setView('landing');
  };

  const formatTime = (seconds) => {
    const mins = Math.floor(seconds / 60);
    const secs = seconds % 60;
    return `${mins.toString().padStart(2, '0')}:${secs.toString().padStart(2, '0')}`;
  };

  return (
    <div className="min-h-screen bg-slate-50 font-sans text-slate-800 flex flex-col antialiased">
      {/* HEADER BAR */}
      <header className="bg-gradient-to-r from-blue-600 via-indigo-600 to-indigo-700 text-white shadow-md">
        <div className="max-w-7xl mx-auto px-4 py-3 flex justify-between items-center flex-wrap gap-2">
          <div className="flex items-center space-x-3 cursor-pointer" onClick={resetToLanding}>
            {/* Custom SVG Graduation Cap Icon */}
            <svg className="w-8 h-8 text-amber-300" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 14l9-5-9-5-9 5 9 5zm0 0l6.16-3.422a12.083 12.083 0 01.665 6.479A11.952 11.952 0 0012 20.055a11.952 11.952 0 00-6.824-2.998 12.078 12.078 0 01.665-6.479L12 14zm-4 6v-7.5l4-2.222" />
            </svg>
            <div>
              <h1 className="text-xl font-bold tracking-tight">KREASI CBT KELAS 4</h1>
              <p className="text-xs text-blue-100 font-medium">Platform Evaluasi & Analisis Instan Siswa SD</p>
            </div>
          </div>
          
          <div className="flex gap-2">
            {view === 'landing' && (
              <button
                onClick={() => setView('teacher_dashboard')}
                className="bg-indigo-800 hover:bg-indigo-900 border border-indigo-400 text-xs text-white font-semibold py-1.5 px-3 rounded-lg transition-colors flex items-center gap-1.5"
              >
                {/* Gear Icon */}
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                </svg>
                Masuk Panel Guru
              </button>
            )}
            {view !== 'landing' && view !== 'student_exam' && (
              <button
                onClick={resetToLanding}
                className="bg-white hover:bg-slate-100 text-indigo-700 text-xs font-bold py-1.5 px-3 rounded-lg transition-colors flex items-center gap-1.5 shadow-sm"
              >
                {/* Home Icon */}
                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" />
                </svg>
                Halaman Utama
              </button>
            )}
          </div>
        </div>
      </header>

      {/* FLOATING NOTIFICATION */}
      {showNotification && (
        <div className="fixed top-4 right-4 z-50 animate-bounce">
          <div className={`p-4 rounded-xl shadow-lg flex items-center space-x-2 text-white font-semibold ${
            showNotification.type === 'error' ? 'bg-rose-600' : showNotification.type === 'warning' ? 'bg-amber-500' : 'bg-emerald-600'
          }`}>
            <span>{showNotification.message}</span>
          </div>
        </div>
      )}

      {/* MAIN LAYOUT CONTAINER */}
      <main className="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 flex flex-col justify-center">

        {/* ======================================= */}
        {/* 1. LANDING PAGE                         */}
        {/* ======================================= */}
        {view === 'landing' && (
          <div className="grid md:grid-cols-2 gap-8 items-center py-10">
            {/* Left Column: Visual Intro */}
            <div className="space-y-6">
              <span className="bg-blue-100 text-blue-800 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">CBT Kelas IV SD</span>
              <h2 className="text-4xl md:text-5xl font-extrabold text-slate-900 leading-tight">
                Ujian Lebih <span className="text-indigo-600 underline decoration-indigo-200">Menyenangkan</span>, Analisis Lebih Akurat!
              </h2>
              <p className="text-slate-600 text-lg leading-relaxed">
                Platform ujian daring interaktif yang dirancang khusus untuk mengacak butir soal secara otomatis dengan **bobot poin soal yang fleksibel (berbeda-beda)**. Memudahkan Bapak/Ibu Guru mendeteksi titik kesulitan belajar siswa dengan analisis butir soal instan!
              </p>
              
              <div className="flex flex-wrap gap-4 pt-2">
                <div className="flex items-center space-x-2 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100">
                  <span className="w-3 h-3 rounded-full bg-emerald-500"></span>
                  <span className="text-xs font-semibold text-slate-700">Acak Soal Sekali Klik</span>
                </div>
                <div className="flex items-center space-x-2 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100">
                  <span className="w-3 h-3 rounded-full bg-blue-500"></span>
                  <span className="text-xs font-semibold text-slate-700">Poin Berbeda Tiap Tingkat Kesulitan</span>
                </div>
                <div className="flex items-center space-x-2 bg-white px-4 py-2 rounded-xl shadow-sm border border-slate-100">
                  <span className="w-3 h-3 rounded-full bg-amber-500"></span>
                  <span className="text-xs font-semibold text-slate-700">Analisis Otomatis Terintegrasi</span>
                </div>
              </div>
            </div>

            {/* Right Column: Portal Cards */}
            <div className="space-y-4">

                            >
                              <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                              </svg>
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  )}
                </div>

              </div>
            )}

            {/* TAB CONTENT: 3. RESULTS HISTORY */}
            {teacherTab === 'results' && (
              <div className="bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-4">
                <div className="flex justify-between items-center">
                  <h4 className="font-bold text-slate-800 text-base">Rekap Hasil Pengerjaan Siswa</h4>
                  <button
                    onClick={() => {
                      if (confirm("Apakah Anda ingin menghapus seluruh riwayat pengerjaan siswa untuk memulai ulang sesi baru?")) {
                        setExamResults([]);
                        triggerNotif("Riwayat ujian berhasil dibersihkan!", "warning");
                      }
                    }}
                    className="text-xs text-rose-600 hover:text-rose-800 font-bold"
                  >
                    Bersihkan Riwayat
                  </button>
                </div>

                {examResults.length === 0 ? (
                  <div className="text-center py-10 text-slate-400 text-sm">
                    Belum ada siswa yang mengumpulkan jawaban. Bagikan tes ke siswa terlebih dahulu!
                  </div>
                ) : (
                  <div className="overflow-x-auto">
                    <table className="w-full text-left text-xs">
                      <thead>
                        <tr className="bg-slate-50 border-b text-slate-400 font-bold">
                          <th className="p-3">Nama Siswa</th>
                          <th className="p-3">Kelas & No</th>
                          <th className="p-3">Waktu Selesai</th>
                          <th className="p-3 text-center">Poin Tercapai</th>
                          <th className="p-3 text-center">Skor Akhir</th>
                          <th className="p-3 text-center">Status</th>
                        </tr>
                      </thead>
                      <tbody className="divide-y text-slate-600">
                        {examResults.map((r) => {
                          const isPassed = r.score >= settings.passingScore;
                          return (
                            <tr key={r.id} className="hover:bg-slate-50">
                              <td className="p-3 font-semibold text-slate-800">{r.studentName}</td>
                              <td className="p-3">Kelas {r.studentClass} / Absen {r.studentNo}</td>
                              <td className="p-3 text-slate-400">{r.submittedAt}</td>
                              <td className="p-3 text-center font-bold text-blue-600">
                                {r.earnedPoints} <span className="text-[10px] text-slate-400">/ {r.totalPoints}</span>
                              </td>
                              <td className="p-3 text-center font-extrabold text-slate-800 text-sm">{r.score}</td>
                              <td className="p-3 text-center">
                                <span className={`px-2 py-1 rounded-full text-[10px] font-bold ${
                                  isPassed ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'
                                }`}>
                                  {isPassed ? 'Lulus' : 'Belum Lulus'}
                                </span>
                              </td>
                            </tr>
                          );
                        })}
                      </tbody>
                    </table>
                  </div>
                )}
              </div>
            )}

            {/* TAB CONTENT: 4. SETTINGS */}
            {teacherTab === 'settings' && (
              <div className="max-w-md bg-white p-6 rounded-3xl shadow-sm border border-slate-100 space-y-6">
                <h4 className="font-bold text-slate-800 text-base">Aturan Parameter Ujian (CBT)</h4>
                
                <div className="space-y-4 text-sm">
                  
                  {/* Randomize Toggle */}
                  <div className="flex justify-between items-center border-b pb-3">
                    <div>
                      <span className="block font-semibold text-slate-700">Acak Urutan Soal</span>
                      <span className="text-xs text-slate-400">Urutan soal siswa diacak secara acak tiap ujian dimulai.</span>
                    </div>
                    <label className="relative inline-flex items-center cursor-pointer">
                      <input 
                        type="checkbox" 
                        checked={settings.randomizeQuestions}
                        onChange={(e) => setSettings(prev => ({ ...prev, randomizeQuestions: e.target.checked }))}
                        className="sr-only peer"
                      />
                      <div className="w-11 h-6 bg-slate-200 peer-focus:outline-none rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-slate-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-blue-600"></div>
                    </label>
                  </div>

                  {/* Duration Slider */}
                  <div className="space-y-2 border-b pb-3">
                    <div className="flex justify-between items-center">
                      <span className="font-semibold text-slate-700">Durasi Ujian</span>
                      <span className="text-sm font-bold text-blue-600">{settings.durationMinutes} Menit</span>
                    </div>
                    <input
                      type="range"
                      min="5"
                      max="120"
                      step="5"
                      value={settings.durationMinutes}
                      onChange={(e) => setSettings(prev => ({ ...prev, durationMinutes: Number(e.target.value) }))}
                      className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                    />
                  </div>

                  {/* Passing Score Target */}
                  <div className="space-y-2 border-b pb-3">
                    <div className="flex justify-between items-center">
                      <span className="font-semibold text-slate-700">KKM (Kriteria Ketuntasan Minimal)</span>
                      <span className="text-sm font-bold text-emerald-600">{settings.passingScore} / 100</span>
                    </div>
                    <input
                      type="range"
                      min="50"
                      max="90"
                      step="5"
                      value={settings.passingScore}
                      onChange={(e) => setSettings(prev => ({ ...prev, passingScore: Number(e.target.value) }))}
                      className="w-full h-2 bg-slate-200 rounded-lg appearance-none cursor-pointer"
                    />
                  </div>

                  <button
                    onClick={() => triggerNotif("Semua pengaturan baru berhasil disimpan!")}
                    className="w-full py-2.5 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl text-xs transition-all shadow-md shadow-blue-100"
                  >
                    Terapkan & Simpan Aturan
                  </button>

                </div>
              </div>
            )}

          </div>
        )}

      </main>

      {/* FOOTER */}
      <footer className="bg-white border-t border-slate-200 py-4 mt-10">
        <div className="max-w-7xl mx-auto px-4 text-center text-xs text-slate-400 space-y-1">
          <p>Â© 2026 Aplikasi CBT Kelas IV SD - Dikembangkan untuk Kemudahan Penilaian Guru.</p>
          <p>Fitur: Acak Soal Instan | Bobot Poin Fleksibel per Soal | Analisis Butir Soal Terintegrasi</p>
        </div>
      </footer>
    </div>
  );
}

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<App />);
  </script>
</body>
</html>
